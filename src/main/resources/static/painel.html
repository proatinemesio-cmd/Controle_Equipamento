<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Registros de Equipamentos</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; background-color: #f4f4f9; }
        .container { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }

        .filtros-container { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filtros-container input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; min-width: 200px; }

        .tabela-registros { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .tabela-registros th, .tabela-registros td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        .tabela-registros th { background-color: #007bff; color: white; }
        .tabela-registros tr:nth-child(even) { background-color: #f9f9f9; }
        .sem-registros { text-align: center; padding: 20px; color: #777; font-style: italic; }
    </style>
</head>
<body>
<div class="container">
    <h2>📊 Painel de Retiradas</h2>

    <div class="filtros-container">
        <input type="text" id="barraPesquisa" placeholder="Pesquisar por aluno, professor ou série..." onkeyup="filtrarTabelaLocal()">
        <input type="date" id="filtroData" onchange="carregarRegistrosPainel()" style="flex: 0 0 160px;">
    </div>

    <table class="tabela-registros">
        <thead>
        <tr>
            <th>Data/Hora</th>
            <th>Professor</th>
            <th>Registro (Nome - N° Equipamento)</th>
            <th>Tipo</th>
        </tr>
        </thead>
        <tbody id="corpoTabela">
        <tr><td colspan="4" class="sem-registros">Carregando registros de hoje...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const urlBase = '';
    let todosOsRegistrosDoDia = [];

    window.onload = function() {
        // Define a data de hoje por padrão no input de data
        const hoje = new Date().toISOString().split('T')[0];
        document.getElementById('filtroData').value = hoje;

        carregarRegistrosPainel();
    };

    // Função para carregar os registros da data selecionada
    async function carregarRegistrosPainel() {
        const dataSelecionada = document.getElementById('filtroData').value;
        let url = urlBase + '/api/registros';

        if (dataSelecionada) {
            url += `?data=${dataSelecionada}`;
        }

        try {
            const resposta = await fetch(url);
            todosOsRegistrosDoDia = await resposta.json();
            renderizarTabela(todosOsRegistrosDoDia);
        } catch (erro) {
            console.error("Erro ao carregar registros:", erro);
            document.getElementById('corpoTabela').innerHTML = `<tr><td colspan="4" class="sem-registros" style="color: red;">Erro ao carregar dados do servidor.</td></tr>`;
        }
    }

    function renderizarTabela(registros) {
        const corpoTabela = document.getElementById('corpoTabela');
        corpoTabela.innerHTML = '';

        if (!registros || registros.length === 0) {
            corpoTabela.innerHTML = `<tr><td colspan="4" class="sem-registros">Nenhum registro encontrado para esta data.</td></tr>`;
            return;
        }

        registros.forEach(reg => {
            let nomeAluno = '';
            if (reg.aluno && reg.aluno.nome) {
                nomeAluno = reg.aluno.nome;
            } else if (reg.nomeAlunoExtra) {
                nomeAluno = reg.nomeAlunoExtra;
            } else {
                nomeAluno = 'Aluno não identificado';
            }

            // Formata a data e hora bonita (Ex: 07/08/2026 14:30)
            let dataFormatada = '';
            if (reg.dataHora) {
                const dataObj = new Date(reg.dataHora);
                dataFormatada = dataObj.toLocaleString('pt-BR');
            }

            // Formato limpo solicitado: Nome - N°2
            const descricaoRegistro = `${nomeAluno} - N°${reg.numeroEquipamento || '?'}`;
            const tipo = reg.tipoEquipamento || '-';
            const professor = reg.nomeProfessor || '-';

            corpoTabela.innerHTML += `
                <tr>
                    <td>${dataFormatada}</td>
                    <td>${professor}</td>
                    <td><b>${descricaoRegistro}</b></td>
                    <td>${tipo}</td>
                </tr>
            `;
        });
    }

    // Filtro de pesquisa em tempo real (pesquisa por série, aluno ou professor na lista já carregada)
    function filtrarTabelaLocal() {
        const termo = document.getElementById('barraPesquisa').value.toLowerCase();

        const registrosFiltrados = todosOsRegistrosDoDia.filter(reg => {
            const nomeAluno = (reg.aluno ? reg.aluno.nome : '') || reg.nomeAlunoExtra || '';
            const numEquip = reg.numeroEquipamento || '';
            const professor = reg.nomeProfessor || '';
            const tipo = reg.tipoEquipamento || '';

            return nomeAluno.toLowerCase().includes(termo) ||
                numEquip.toLowerCase().includes(termo) ||
                professor.toLowerCase().includes(termo) ||
                tipo.toLowerCase().includes(termo);
        });

        renderizarTabela(registrosFiltrados);
    }
</script>
</body>
</html>S
