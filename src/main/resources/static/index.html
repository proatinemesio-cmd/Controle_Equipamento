<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Retirada de Equipamentos</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background-color: #f4f4f9; }
        .container { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
        select, input[type="text"], input[type="number"] { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }

        /* Estilo para os atalhos de tipo de equipamento */
        .atalhos-equip { display: flex; gap: 8px; margin-top: 8px; }
        .btn-atalho { flex: 1; background-color: #e9ecef; border: 1px solid #ced4da; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; color: #495057; text-align: center; transition: 0.2s; }
        .btn-atalho:hover, .btn-atalho.ativo { background-color: #007bff; color: white; border-color: #007bff; }

        .lista-alunos { margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px; }
        .linha-aluno { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
        .linha-aluno span { flex: 1; font-size: 14px; }
        .linha-aluno input { width: 90px; padding: 8px; border: 1px solid #ccc; border-radius: 5px; text-align: center; }

        .extra-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        .btn-remover { background-color: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-extra { background-color: #17a2b8; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; font-weight: bold; }
        .btn-salvar { background-color: #28a745; color: white; border: none; padding: 15px; border-radius: 5px; margin-top: 25px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-salvar:hover { background-color: #218838; }
    </style>
</head>
<body>
<div class="container">
    <h2>💻 Controle de Equipamentos</h2>

    <form id="formRetirada">
        <label>Nome do Professor:</label>
        <input type="text" id="professor" placeholder="Digite seu nome" required>

        <!-- Campo Único Inteligente para Turma (Digitar ou Selecionar) -->
        <label>Turma / Série:</label>
        <input type="text" id="inputTurma" list="listaTurmasDatalist" placeholder="Digite ou selecione a turma (Ex: 6b, 1a...)" autocomplete="off">
        <datalist id="listaTurmasDatalist">
            <!-- Preenchido via JavaScript -->
        </datalist>

        <!-- Campo de Tipo de Equipamento com Atalhos -->
        <label>Tipo de Equipamento:</label>
        <input type="text" id="tipoEquipamento" placeholder="Ex: Chromebooks, Tablets..." required>
        <div class="atalhos-equip">
            <div class="btn-atalho" onclick="selecionarTipo('Chromebooks', this)">Chromebooks</div>
            <div class="btn-atalho" onclick="selecionarTipo('Tablets', this)">Tablets</div>
            <div class="btn-atalho" onclick="selecionarTipo('Notebooks', this)">Notebooks</div>
        </div>

        <div id="areaAlunos" class="lista-alunos" style="display: none;">
        </div>

        <button type="button" id="btnAdicionarExtra" class="btn-extra" style="display: none;">+ Adicionar aluno que não está na lista</button>

        <button type="button" id="btnSalvar" class="btn-salvar">Registrar Retirada</button>
    </form>
</div>

<script>
    const urlBase = '';
    let listaTurmasGlobal = [];
    let turmaSelecionadaId = null;

    window.onload = function() {
        fetch(urlBase + '/api/turmas')
            .then(response => response.json())
            .then(turmas => {
                // Ordena do 6° até o 3° (decrescente)
                turmas.sort((a, b) => b.nome.localeCompare(a.nome, 'pt-BR', { numeric: true }));
                listaTurmasGlobal = turmas;

                const datalist = document.getElementById('listaTurmasDatalist');
                datalist.innerHTML = '';
                turmas.forEach(t => {
                    datalist.innerHTML += `<option value="${t.nome}"></option>`;
                });
            })
            .catch(err => console.error("Erro ao buscar turmas:", err));
    };

    // Monitora o que o usuário digita ou seleciona no campo único de turma
    document.getElementById('inputTurma').addEventListener('input', function() {
        const valorDigitado = this.value.trim();

        // Tenta achar uma turma correspondente ignorando maiúsculas, espaços e símbolos (°/º)
        const valorLimpo = valorDigitado.toLowerCase().replace(/°|º|\s/g, '');

        const turmaEncontrada = listaTurmasGlobal.find(t => {
            const nomeLimpo = t.nome.toLowerCase().replace(/°|º|\s/g, '');
            return nomeLimpo === valorLimpo;
        });

        if (turmaEncontrada) {
            turmaSelecionadaId = turmaEncontrada.id;
            carregarAlunosDaTurma(turmaSelecionadaId);
        } else {
            turmaSelecionadaId = null;
            document.getElementById('areaAlunos').style.display = 'none';
            document.getElementById('btnAdicionarExtra').style.display = 'none';
        }
    });

    function carregarAlunosDaTurma(turmaId) {
        const areaAlunos = document.getElementById('areaAlunos');
        const btnExtra = document.getElementById('btnAdicionarExtra');

        fetch(urlBase + '/api/alunos/turma/' + turmaId)
            .then(response => response.json())
            .then(alunos => {
                alunos.sort((a, b) => a.nome.localeCompare(b.nome));
                alunosDaTurmaAtual = alunos;
                renderizarTelaAlunos();
                areaAlunos.style.display = 'block';
                btnExtra.style.display = 'block';
            });
    }

    // Função para os botões de atalho de tipo de equipamento
    window.selecionarTipo = function(tipo, elemento) {
        document.getElementById('tipoEquipamento').value = tipo;
        document.querySelectorAll('.btn-atalho').forEach(b => b.classList.remove('ativo'));
        elemento.classList.add('ativo');
    }

    let alunosDaTurmaAtual = [];

    function renderizarTelaAlunos() {
        const areaAlunos = document.getElementById('areaAlunos');

        const dadosDigitados = {};
        document.querySelectorAll('.linha-aluno[data-id]').forEach(linha => {
            const alunoId = linha.getAttribute('data-id');
            const valorInput = linha.querySelector('.equip-input').value;
            if (valorInput) dadosDigitados[alunoId] = valorInput;
        });

        const extrasSalvos = [];
        document.querySelectorAll('.extra-row').forEach(linha => {
            const nome = linha.querySelector('.extra-nome').value;
            const equip = linha.querySelector('.extra-equip').value;
            extrasSalvos.push({ nome, equip });
        });

        areaAlunos.innerHTML = `<h3>Lista de Alunos</h3>`;

        alunosDaTurmaAtual.forEach(aluno => {
            const valorSalvo = dadosDigitados[aluno.id] || '';
            areaAlunos.innerHTML += `
                <div class="linha-aluno" data-id="${aluno.id}">
                    <span>${aluno.nome}</span>
                    <input type="text" class="equip-input" placeholder="Nº Equip" value="${valorSalvo}">
                </div>
            `;
        });

        extrasSalvos.forEach((extra, index) => {
            areaAlunos.innerHTML += `
                <div class="linha-aluno extra-row" data-index="${index}">
                    <input type="text" class="extra-nome" placeholder="Nome do aluno extra" value="${extra.nome}" style="flex: 1;">
                    <input type="text" class="extra-equip" placeholder="Nº Equip" value="${extra.equip}" style="width: 90px;">
                    <button type="button" class="btn-remover" onclick="removerExtra(this)">X</button>
                </div>
            `;
        });
    }

    window.removerExtra = function(botao) {
        botao.closest('.extra-row').remove();
    };

    document.getElementById('btnAdicionarExtra').addEventListener('click', function() {
        const areaAlunos = document.getElementById('areaAlunos');

        const dadosDigitados = {};
        document.querySelectorAll('.linha-aluno[data-id]').forEach(linha => {
            const alunoId = linha.getAttribute('data-id');
            const valorInput = linha.querySelector('.equip-input').value;
            if (valorInput) dadosDigitados[alunoId] = valorInput;
        });

        const extrasSalvos = [];
        document.querySelectorAll('.extra-row').forEach(linha => {
            const nome = linha.querySelector('.extra-nome').value;
            const equip = linha.querySelector('.extra-equip').value;
            extrasSalvos.push({ nome, equip });
        });

        extrasSalvos.push({ nome: '', equip: '' });

        areaAlunos.innerHTML = `<h3>Lista de Alunos</h3>`;
        alunosDaTurmaAtual.forEach(aluno => {
            const valorSalvo = dadosDigitados[aluno.id] || '';
            areaAlunos.innerHTML += `
                <div class="linha-aluno" data-id="${aluno.id}">
                    <span>${aluno.nome}</span>
                    <input type="text" class="equip-input" placeholder="Nº Equip" value="${valorSalvo}">
                </div>
            `;
        });

        extrasSalvos.forEach((extra, index) => {
            areaAlunos.innerHTML += `
                <div class="linha-aluno extra-row" data-index="${index}">
                    <input type="text" class="extra-nome" placeholder="Nome do aluno extra" value="${extra.nome}" style="flex: 1;">
                    <input type="text" class="extra-equip" placeholder="Nº Equip" value="${extra.equip}" style="width: 90px;">
                    <button type="button" class="btn-remover" onclick="removerExtra(this)">X</button>
                </div>
            `;
        });
    });

    document.getElementById('btnSalvar').addEventListener('click', function() {
        const professor = document.getElementById('professor').value.trim();
        const tipoEquipamento = document.getElementById('tipoEquipamento').value.trim();

        if(!professor) { alert("Preencha o nome do professor!"); return; }
        if(!turmaSelecionadaId) { alert("Selecione uma turma válida da lista!"); return; }
        if(!tipoEquipamento) { alert("Informe ou selecione o tipo de equipamento!"); return; }

        const promessas = [];

        const agora = new Date();
        const offsetMs = agora.getTimezoneOffset() * 60 * 1000;
        const dataLocal = new Date(agora.getTime() - offsetMs).toISOString().slice(0, 19);

        document.querySelectorAll('.linha-aluno[data-id]').forEach(linha => {
            const inputEquip = linha.querySelector('.equip-input');
            if(inputEquip.value.trim() !== '') {
                promessas.push(fetch(urlBase + '/api/registros', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        nomeProfessor: professor,
                        numeroEquipamento: inputEquip.value.trim(),
                        tipoEquipamento: tipoEquipamento,
                        dataHora: dataLocal,
                        aluno: { id: linha.getAttribute('data-id') }
                    })
                }));
            }
        });

        let erroExtraIncompleto = false;
        document.querySelectorAll('.extra-row').forEach(linha => {
            const inputNome = linha.querySelector('.extra-nome');
            const inputEquip = linha.querySelector('.extra-equip');
            const nomeVal = inputNome.value.trim();
            const equipVal = inputEquip.value.trim();

            if((nomeVal !== '' && equipVal === '') || (nomeVal === '' && equipVal !== '')) {
                erroExtraIncompleto = true;
            }

            if(nomeVal !== '' && equipVal !== '') {
                promessas.push(fetch(urlBase + '/api/registros', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        nomeProfessor: professor,
                        numeroEquipamento: equipVal,
                        tipoEquipamento: tipoEquipamento,
                        dataHora: dataLocal,
                        nomeAlunoExtra: nomeVal
                    })
                }));
            }
        });

        if(erroExtraIncompleto) {
            alert("⚠️ Há um aluno extra com o nome ou o equipamento incompleto. Preencha ambos ou remova a linha.");
            return;
        }

        if(promessas.length === 0) {
            alert("Nenhum equipamento foi preenchido para salvar.");
            return;
        }

        Promise.all(promessas).then(() => {
            alert("✅ Todos os registros salvos com sucesso!");
            location.reload();
        }).catch(() => {
            alert("❌ Ocorreu um erro ao salvar alguns registros.");
        });
    });

    // Pular para o próximo campo ao apertar ENTER
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            const focusableElements = Array.from(document.querySelectorAll('input, select, button'));
            const index = focusableElements.indexOf(document.activeElement);

            if (index > -1 && focusableElements[index + 1]) {
                if (document.activeElement.id !== 'btnSalvar') {
                    event.preventDefault();
                    focusableElements[index + 1].focus();
                }
            }
        }
    });
</script>
</body>
</html>
